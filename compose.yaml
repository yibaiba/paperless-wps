services:
  diagrams:
    image: jgraph/drawio:29.6.5
    ports:
      - "127.0.0.1:8086:8080"
    environment:
      DRAWIO_LANG: zh
      DRAWIO_SERVER_URL: http://127.0.0.1:5176/diagram-editor/
    restart: unless-stopped
  search-embeddings:
    profiles: ["search"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command:
      - --model-id
      - Qwen/Qwen3-Embedding-0.6B
      - --auto-truncate
      - --max-batch-tokens
      - "1024"
      - --max-client-batch-size
      - "8"
    ports:
      - "127.0.0.1:18081:80"
    volumes:
      - ./data/search-models/hub:/data
    restart: unless-stopped
  search-models:
    profiles: ["search"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command:
      - --model-id
      - BAAI/bge-reranker-base
      - --auto-truncate
      - --max-batch-tokens
      - "4096"
      - --max-client-batch-size
      - "64"
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./data/search-models/hub:/data
    restart: unless-stopped
  database:
    image: pgvector/pgvector:pg17
    ports:
      - "127.0.0.1:25432:5432"
    environment:
      POSTGRES_DB: presales
      POSTGRES_USER: presales
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env using scripts/setup.py}
    volumes:
      - presales_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presales -d presales"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  presales_database:
