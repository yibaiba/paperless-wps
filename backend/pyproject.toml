[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "presales-platform"
version = "0.1.0"
description = "Product source catalog and presales project lists"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.0,<2",
  "defusedxml>=0.7,<1",
  "zen-engine==0.53.0",
  "httpx>=0.28,<1",
  "pypdf>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-timeout>=2,<3", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
